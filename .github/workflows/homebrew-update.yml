name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Cask File
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          # Remove 'v' prefix from tag name safely in bash
          VERSION_CLEAN=$(echo $TAG_NAME | sed 's/^v//')
          echo "Updating to version $VERSION_CLEAN"
          
          mkdir -p homebrew-tap/Casks
          
          cat > homebrew-tap/Casks/sshkm.rb <<EOF
cask "sshkm" do
  version "${VERSION_CLEAN}"
  sha256 :no_check

  if Hardware::CPU.intel?
    url "https://github.com/${REPO_NAME}/releases/download/v#{version}/SSH.Keys.Manager_#{version}_x64.dmg"
  else
    url "https://github.com/${REPO_NAME}/releases/download/v#{version}/SSH.Keys.Manager_#{version}_aarch64.dmg"
  end

  name "SSH Keys Manager"
  desc "Safe and modern SSH key management tool"
  homepage "https://sshkm.ru"

  app "SSH Keys Manager.app"

  zap trash: [
    "~/Library/Application Support/com.dbelyaeff.sshkeysmanager",
    "~/Library/Saved Application State/com.dbelyaeff.sshkeysmanager.savedState",
  ]
end
EOF

      - name: Commit and Push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/sshkm.rb
          git commit -m "Update sshkm to version $TAG_NAME"
          git push
