[package]
name = "ssh-keys-manager"
version = "0.1.0"
description = "SSH Keys Manager"
authors = []
edition = "2021"

[lib]
name = "ssh_keys_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
dirs = "5"
flate2 = "1"
tar = "0.4"
anyhow = "1"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
